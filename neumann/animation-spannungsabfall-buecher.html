<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spannungsabfall – Bücher-Modell</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2430;--muted:#556070;--line:#ddd6c8;--hi:#fff6cf;--nav:#1f2a3a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
body{font-size:clamp(15px,1.1vw,21px);line-height:1.35}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:7px 16px;background:var(--nav);color:#fff}
header h1{margin:0;font-size:1.05em;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tabs button{font:inherit;font-size:.82em;padding:5px 10px;border-radius:8px;border:1px solid #46566e;background:#2b3a50;color:#dfe6f0;cursor:pointer}
.tabs button.on{background:#ffd54f;color:#1d2430;border-color:#ffd54f;font-weight:700}
.icon{font:inherit;font-size:.82em;padding:5px 10px;border-radius:8px;border:1px solid #46566e;background:transparent;color:#fff;cursor:pointer}
#zumKurs{font-size:.82em;padding:5px 10px;border-radius:8px;border:1px solid #7d8da6;color:#fff;text-decoration:none;white-space:nowrap}#zumKurs:hover{background:rgba(255,255,255,.12)}#zumKurs[hidden]{display:none}
main{max-width:1600px;margin:0 auto;padding:6px 16px 70px}
h2{margin:4px 0 2px;font-size:1.4em}
.lead{margin:0 0 8px;color:var(--muted);max-width:1250px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.stage svg{width:100%;height:auto;max-height:34vh;display:block;margin:0 auto}
.chart svg,.circ svg{width:100%;height:auto;max-height:29vh;display:block;margin:0 auto}
.heiz svg{width:100%;height:auto;max-height:58vh;display:block;margin:0 auto}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin:8px 0}
.btn{font:inherit;padding:6px 14px;border-radius:9px;border:1px solid #b8b09f;background:#fff;color:var(--ink);cursor:pointer}
.btn:hover{background:#f1ede4}
.btn.primary{background:var(--nav);border-color:var(--nav);color:#fff}
.btn.on{background:#ffd54f;border-color:#e0b400;font-weight:700}
.ctl{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.ctl input[type=range]{width:min(170px,38vw)}
.ctl b{min-width:6em;display:inline-block}
.ctl .btn{padding:4px 10px}
.grid3{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
@media (max-width:1000px){.grid3,.grid2{grid-template-columns:1fr}}
.merk{background:var(--hi);border-left:6px solid #e0b400;border-radius:8px;padding:7px 12px;margin:0 0 8px}
.merk>b:first-child{display:block;margin-bottom:2px}
.info{background:#eef4fb;border-left:6px solid #5c8fd6;border-radius:8px;padding:7px 12px;margin:8px 0 0;font-size:.95em}
.warnbox{background:#fdecea;border-left:6px solid #c62828;border-radius:8px;padding:7px 12px;margin:8px 0 0;font-size:.95em}
table.tr{border-collapse:collapse;width:100%;font-size:.92em}
table.tr td,table.tr th{border-bottom:1px solid #eee7da;padding:3px 6px;text-align:left;vertical-align:top}
table.tr th{color:var(--muted);font-weight:600}
.vals{font-size:.97em}
.vals .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee7da;padding:3px 0}
.vals .row b{white-space:nowrap}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;margin-right:6px;vertical-align:-1px}
ul.probe{margin:6px 0 0;padding-left:1.2em}
footer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:5}
.hint{color:var(--muted);font-size:.85em}
svg text{font-family:"Segoe UI",system-ui,Arial,sans-serif}
.lg{font-size:18px;font-weight:700}
.lbl{font-size:18px;font-weight:700}
.sm{font-size:15px}
.pl{font-size:26px;font-weight:800;fill:#263238}
.tick{font-size:16px;fill:#555}
.axl{font-size:17px;fill:#333}
.clab{font-size:17px;font-weight:700}
.big{font-size:24px;font-weight:800}
table.ov{border-collapse:separate;border-spacing:0;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.ov th,table.ov td{padding:7px 10px;border-bottom:1px solid #eee7da;vertical-align:top;text-align:left}
table.ov thead th{background:#2b3a50;color:#fff}
table.ov tbody th{background:#faf7f0;width:17%}
.quelle{color:var(--muted);font-size:.8em;margin-top:8px}
</style>
</head>
<body>
<header>
  <a id="zumKurs" href="#" target="_top" hidden>← Zurück zum Moodle-Kurs</a>
  <h1>Spannung und Spannungsabfall – das Bücher-Modell</h1>
  <nav class="tabs" id="tabs"></nav>
  <button class="icon" id="fs" title="Vollbild (Taste F)">⛶ Vollbild</button>
</header>
<main>
  <noscript><p class="merk"><b>Hinweis</b>Diese Animation braucht JavaScript. Bitte die Datei in einem Browser öffnen (Chrome, Edge, Firefox oder Safari).</p></noscript>
  <h2 id="ttl"></h2>
  <p class="lead" id="lead"></p>
  <div id="content"></div>
</main>
<footer>
  <button class="btn" id="prev">◀ Zurück</button>
  <span class="hint" id="pos"></span>
  <button class="btn primary" id="next">Weiter ▶</button>
</footer>
<script>
(()=>{
'use strict';
/* ---------- Grundlagen ---------- */
const C_A='#c62828',C_B='#1565c0',C_L='#e65100',C_G='#546e7a',C_F='#2e7d32';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,u)=>a+(b-a)*u;
const ease=u=>{u=clamp(u,0,1);return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;};
const q=v=>Math.round(v*10)/10;
const fmt=(v,d)=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});
const now=()=>performance.now()/1000;
const LO=[30,99,198],MI=[142,68,173],HI=[211,47,47];
function pcol(f){f=clamp(f,0,1);let a,b,u;if(f<.5){a=LO;b=MI;u=f/.5;}else{a=MI;b=HI;u=(f-.5)/.5;}
  return 'rgb('+Math.round(lerp(a[0],b[0],u))+','+Math.round(lerp(a[1],b[1],u))+','+Math.round(lerp(a[2],b[2],u))+')';}
function put(id,h){const el=document.getElementById(id);if(el&&el._h!==h){el.innerHTML=h;el._h=h;}}
function on(id,fn,ev){const el=document.getElementById(id);if(el)el.addEventListener(ev||'click',fn);}
const svg=(w,h,s)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;

/* ---------- Zeichen-Bausteine ---------- */
const floorL=y=>`<line x1="0" y1="${y}" x2="1000" y2="${y}" stroke="#cfc6b4" stroke-width="3"/>`;
const table=(x1,x2,top,fl)=>`<rect x="${x1+18}" y="${top+10}" width="10" height="${fl-top-10}" fill="#8d6e4a"/><rect x="${x2-28}" y="${top+10}" width="10" height="${fl-top-10}" fill="#8d6e4a"/><rect x="${x1}" y="${top}" width="${x2-x1}" height="12" rx="3" fill="#b9935f" stroke="#7a5a33"/>`;
function book(x,y,w,h,col,a){a=a==null?1:a;x=q(x);y=q(y);
  return `<g opacity="${q(a)}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${col}" stroke="rgba(0,0,0,.55)" stroke-width="1.3"/>`+
  `<line x1="${q(x+4)}" y1="${q(y+4)}" x2="${q(x+w-4)}" y2="${q(y+4)}" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>`+
  `<line x1="${q(x+4)}" y1="${q(y+h-4)}" x2="${q(x+w-4)}" y2="${q(y+h-4)}" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>`+
  `<rect x="${q(x+w*.3)}" y="${q(y+h*.3)}" width="${q(w*.4)}" height="${q(h*.4)}" rx="2" fill="rgba(255,255,255,.78)"/></g>`;}
function wheel(cx,cy,r,ang,col){const c=Math.cos(ang)*r*.8,s=Math.sin(ang)*r*.8;
  return `<circle cx="${q(cx)}" cy="${cy}" r="${r}" fill="${col||'#cfd8dc'}" stroke="#37474f" stroke-width="2"/><line x1="${q(cx-c)}" y1="${q(cy-s)}" x2="${q(cx+c)}" y2="${q(cy+s)}" stroke="#37474f" stroke-width="2"/>`;}
function heat(x1,x2,y,a){if(a<=.02)return '';let d=`M${q(x1)},${y}`,i=0;for(let x=x1+5;x<=x2;x+=5,i++)d+=` L${q(x)},${y+(i%2?-3:3)}`;
  return `<path d="${d}" fill="none" stroke="${C_L}" stroke-width="2.4" opacity="${q(clamp(a,0,1))}"/>`;}
function arrowH(x1,x2,y,col,w){const L=Math.abs(x2-x1);if(L<3)return '';const d=Math.sign(x2-x1),hd=Math.min(18,L*.6),xs=x2-d*hd;
  return `<line x1="${q(x1)}" y1="${y}" x2="${q(xs)}" y2="${y}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${q(x2)},${y} ${q(xs)},${y-w*1.5} ${q(xs)},${y+w*1.5}" fill="${col}"/>`;}
function person(hx,fl,dir,label,hand){
  const L=50,hip=[hx,fl-70],sh=[hx+dir*16,fl-118],head=[sh[0]+dir*9,sh[1]-21];
  const fb=[hx-dir*30,fl],kf=[hx+dir*14,fl-36],ff=[hx+dir*8,fl];
  const elbow=(S,H)=>{const dx=H[0]-S[0],dy=H[1]-S[1],d=Math.hypot(dx,dy)||1,m=[(S[0]+H[0])/2,(S[1]+H[1])/2];
    if(d>=2*L)return m;const h=Math.sqrt(L*L-d*d/4);let px=-dy/d,py=dx/d;if(py<0){px=-px;py=-py;}return [m[0]+px*h,m[1]+py*h];};
  const H1=hand,H2=[hand[0]-dir*2,hand[1]+9],S2=[sh[0]-dir*3,sh[1]+4];
  const P=a=>a.map(p=>q(p[0])+','+q(p[1])).join(' ');
  return `<g stroke="#263238" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="${P([hip,fb])}"/><polyline points="${P([hip,kf,ff])}"/><polyline points="${P([hip,sh])}"/><polyline points="${P([S2,elbow(S2,H2),H2])}"/><polyline points="${P([sh,elbow(sh,H1),H1])}"/><circle cx="${q(head[0])}" cy="${q(head[1])}" r="15" fill="#fff"/></g><text x="${q(hx-dir*36)}" y="${fl-80}" text-anchor="middle" class="pl">${label}</text>`;}
function legend(items,y){let x=16,s='';for(const [col,txt] of items){s+=`<rect x="${x}" y="${y-14}" width="15" height="15" rx="3" fill="${col}"/><text x="${x+21}" y="${y}" class="lg" fill="${col}">${txt}</text>`;x+=36+txt.length*9.4;}return s;}
function plegend(x,y){return `<defs><linearGradient id="plg${x}${y}" x1="0" x2="1"><stop offset="0" stop-color="${pcol(1)}"/><stop offset=".5" stop-color="${pcol(.5)}"/><stop offset="1" stop-color="${pcol(0)}"/></linearGradient></defs><text x="${x}" y="${y}" class="sm" fill="#333">Druck: hoch</text><rect x="${x+86}" y="${y-12}" width="90" height="13" rx="3" fill="url(#plg${x}${y})"/><text x="${x+182}" y="${y}" class="sm" fill="#333">niedrig</text>`;}
function gauge(x,y,val,max,unit,yBot,dec){const f=clamp(val/max,0,1),a=(-120+240*f)*Math.PI/180;let t='';
  for(let i=0;i<=4;i++){const b=(-120+60*i)*Math.PI/180;t+=`<line x1="${q(x+Math.sin(b)*16)}" y1="${q(y-Math.cos(b)*16)}" x2="${q(x+Math.sin(b)*21)}" y2="${q(y-Math.cos(b)*21)}" stroke="#263238" stroke-width="2"/>`;}
  return `<line x1="${q(x)}" y1="${y+24}" x2="${q(x)}" y2="${yBot}" stroke="#263238" stroke-dasharray="5 4" stroke-width="2"/><circle cx="${q(x)}" cy="${y}" r="24" fill="#fff" stroke="#263238" stroke-width="3"/>${t}<line x1="${q(x)}" y1="${y}" x2="${q(x+Math.sin(a)*15)}" y2="${q(y-Math.cos(a)*15)}" stroke="${C_A}" stroke-width="3.5" stroke-linecap="round"/><circle cx="${q(x)}" cy="${y}" r="3.5" fill="#263238"/><rect x="${q(x+30)}" y="${y-15}" width="84" height="30" rx="7" fill="#263238"/><text x="${q(x+72)}" y="${y+7}" text-anchor="middle" fill="#fff" class="lbl">${fmt(val,dec||0)} ${unit}</text>`;}
function tag(x,y,txt,col){const w=txt.length*9+12;return `<rect x="${q(x-w/2)}" y="${y-16}" width="${w}" height="22" rx="5" fill="#fff" stroke="${col||'#263238'}" stroke-width="1.5"/><text x="${q(x)}" y="${y}" text-anchor="middle" class="sm" font-weight="700" fill="${col||'#263238'}">${txt}</text>`;}
function pathAt(P,S,s){for(let i=1;i<P.length;i++){if(s<=S[i]){const u=(s-S[i-1])/((S[i]-S[i-1])||1);return [lerp(P[i-1][0],P[i][0],u),lerp(P[i-1][1],P[i][1],u)];}}return P[P.length-1];}
function cum(P){const S=[0];for(let i=1;i<P.length;i++)S.push(S[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));return S;}

/* ---------- Diagramm ---------- */
function chart(o){
  const W=o.W||560,H=o.H||320,p=Object.assign({l:66,r:o.yt2?66:22,t:30,b:58},o.pad||{});
  const sx=v=>p.l+(v-o.x[0])/(o.x[1]-o.x[0])*(W-p.l-p.r), sy=v=>H-p.b-(v-o.y[0])/(o.y[1]-o.y[0])*(H-p.t-p.b);
  let s='';
  for(const v of o.yt){const y=q(sy(v));s+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#eee8dc"/><text x="${p.l-8}" y="${y+5}" text-anchor="end" class="tick">${fmt(v)}</text>`;}
  if(o.yt2)for(const [v,lab] of o.yt2){const y=q(sy(v));s+=`<text x="${W-p.r+8}" y="${y+5}" class="tick" fill="#8a5a00">${lab}</text>`;}
  s+=o.content(sx,sy);
  for(const [v,lab,tk] of (o.xt||[])){const x=q(sx(v));if(tk!==false)s+=`<line x1="${x}" x2="${x}" y1="${H-p.b}" y2="${H-p.b+6}" stroke="#333"/>`;s+=`<text x="${x}" y="${H-p.b+24}" text-anchor="middle" class="tick">${lab}</text>`;}
  s+=`<line x1="${p.l}" y1="${p.t-8}" x2="${p.l}" y2="${H-p.b}" stroke="#333" stroke-width="2"/><line x1="${p.l}" y1="${H-p.b}" x2="${W-p.r+6}" y2="${H-p.b}" stroke="#333" stroke-width="2"/>`;
  if(o.yt2)s+=`<line x1="${W-p.r}" y1="${p.t-8}" x2="${W-p.r}" y2="${H-p.b}" stroke="#8a5a00" stroke-width="1.5"/>`;
  s+=`<text x="${q((p.l+W-p.r)/2)}" y="${H-10}" text-anchor="middle" class="axl">${o.xlab}</text>`;
  s+=`<text transform="translate(18 ${q((p.t+H-p.b)/2)}) rotate(-90)" text-anchor="middle" class="axl">${o.ylab}</text>`;
  if(o.ylab2)s+=`<text transform="translate(${W-8} ${q((p.t+H-p.b)/2)}) rotate(90)" text-anchor="middle" class="axl" fill="#8a5a00">${o.ylab2}</text>`;
  return svg(W,H,s);
}
const poly=(pts,col,w,extra)=>`<polyline points="${pts.map(p=>q(p[0])+','+q(p[1])).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra||''}/>`;

/* ---------- Messen (Schritt 2 und 3) ---------- */
function measure(M,t,J){if(!M.play)return;const per=1.15,el=Math.max(0,t-M.t0),i=Math.floor(el/per),u=(el-i*per)/per;
  if(i>=J.length){M.play=false;M.rev=J.length-1;M.gx=J[J.length-1];return;}
  M.gx=lerp(i?J[i-1]:J[0],J[i],ease(u/.45));M.rev=u>=.45?i:i-1;}
function interp(J,F,x){if(x<=J[0])return F[0];for(let i=1;i<J.length;i++)if(x<=J[i])return lerp(F[i-1],F[i],(x-J[i-1])/(J[i]-J[i-1]));return F[F.length-1];}

/* ---------- Stromkreis (Schritt 3 und 4) ---------- */
function circuitSVG(c){
  const x1=100,x2=400,y1=62,y2=262,b1=146,b2=180,ly=162,lr=26,Um=12;
  const P=[[x1,b1],[x1,y1],[x2,y1],[x2,ly-lr],[x2,ly+lr],[x2,y2],[x1,y2],[x1,b2]],S=cum(P);
  const LH=S[3],LL=S[4]-S[3],LR=S[7]-S[4];
  const pot=s=>s<=LH?c.U-c.Uh*s/LH:s<=LH+LL?c.U-c.Uh-c.Ul*(s-LH)/LL:c.U-c.Uh-c.Ul-c.Ur*(s-LH-LL)/LR;
  let defs='',w='';
  for(let i=1;i<P.length;i++){if(i===4)continue;const [ax,ay]=P[i-1],[bx,by]=P[i],id=c.id+'w'+i;
    defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"><stop offset="0" stop-color="${pcol(pot(S[i-1])/Um)}"/><stop offset="1" stop-color="${pcol(pot(S[i])/Um)}"/></linearGradient>`;
    w+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="url(#${id})" stroke-width="10" stroke-linecap="round"/>`;}
  let dots='';
  if(c.I>0){const sp=30,tot=S[7];for(let s=((c.ph%sp)+sp)%sp;s<tot;s+=sp){if(s>LH-3&&s<LH+LL+3)continue;const p=pathAt(P,S,s);dots+=`<circle cx="${q(p[0])}" cy="${q(p[1])}" r="3.8" fill="#fff" stroke="#263238" stroke-width="1.2"/>`;}}
  const g=clamp(c.glow,0,1),k=lr*.707;
  defs+=`<radialGradient id="${c.id}gl"><stop offset="0" stop-color="#fff59d" stop-opacity="1"/><stop offset=".55" stop-color="#ffee58" stop-opacity=".55"/><stop offset="1" stop-color="#ffee58" stop-opacity="0"/></radialGradient>`;
  let s=`<defs>${defs}</defs>`+w+dots;
  s+=`<circle cx="${x2}" cy="${ly}" r="${q(lr+44*g)}" fill="url(#${c.id}gl)" opacity="${q(g)}"/>`;
  s+=`<circle cx="${x2}" cy="${ly}" r="${lr}" fill="${g>.03?'rgb(255,'+Math.round(250-30*g)+','+Math.round(225-140*g)+')':'#fff'}" stroke="#263238" stroke-width="3"/><line x1="${q(x2-k)}" y1="${q(ly-k)}" x2="${q(x2+k)}" y2="${q(ly+k)}" stroke="#263238" stroke-width="2.5"/><line x1="${q(x2-k)}" y1="${q(ly+k)}" x2="${q(x2+k)}" y2="${q(ly-k)}" stroke="#263238" stroke-width="2.5"/>`;
  s+=`<rect x="${x1-30}" y="${b1+3}" width="60" height="${b2-b1-6}" fill="#fff"/><line x1="${x1-26}" y1="${b1}" x2="${x1+26}" y2="${b1}" stroke="#263238" stroke-width="4"/><line x1="${x1-13}" y1="${b2}" x2="${x1+13}" y2="${b2}" stroke="#263238" stroke-width="10"/>`;
  s+=`<text x="${x1+34}" y="${b1+6}" class="lbl" fill="${C_A}">+</text><text x="${x1+22}" y="${b2+8}" class="lbl" fill="${C_B}">−</text>`;
  s+=`<text x="${x1-36}" y="${b1+10}" text-anchor="end" class="lbl">U₁ =</text><text x="${x1-36}" y="${b1+32}" text-anchor="end" class="lbl">${fmt(c.U,1)} V</text>`;
  s+=`<text x="${q((x1+x2)/2-40)}" y="${y1-16}" text-anchor="middle" class="sm" font-weight="700">Hinleiter: ${fmt(c.Uh,2)} V</text>`;
  s+=`<text x="${q((x1+x2)/2-40)}" y="${y2+30}" text-anchor="middle" class="sm" font-weight="700">Rückleiter: ${fmt(c.Ur,2)} V</text>`;
  s+=`<text x="${x2-lr-12}" y="${ly-4}" text-anchor="end" class="lbl">Lampe</text><text x="${x2-lr-12}" y="${ly+20}" text-anchor="end" class="lbl" fill="${C_L}">U₂ = ${fmt(c.Ul,2)} V</text>`;
  if(c.amps){for(const yy of [y1,y2]){s+=`<circle cx="330" cy="${yy}" r="14" fill="#fff" stroke="#263238" stroke-width="2.5"/><text x="330" y="${yy+6}" text-anchor="middle" class="lbl">A</text>`;}
    s+=`<text x="330" y="${y1-20}" text-anchor="middle" class="lbl" fill="${C_F}">${fmt(c.I,2)} A</text><text x="330" y="${y2+34}" text-anchor="middle" class="lbl" fill="${C_F}">${fmt(c.I,2)} A</text>`;

/* =====================================================================

const G1={X0:170,W:82,BW:78,BH:30,TOP:236,FL:300};

  s+=`<text x="520" y="${g.TOP+40}" text-anchor="middle" class="sm" font-weight="700" fill="${C_L}">Reibung bremst jedes Buch (je 15 N)</text>`;

}

/* =====================================================================
   SCHRITT 4 – Durchfluss = Strom
   ===================================================================== */
const S4={drive:1,h:3,bad:false,run:true,o:30,rot:0,ph:0,fall:[]};
const G4={xs:150,xe:918,P:64,BW:60,BH:28,FL:318,TT:240,RY:232,BY:196,sx1:430,sx2:610};
function m4(){const rl=S4.bad?2:.25,rc=8*S4.h,R=2*rl+rc,U=12*S4.drive,I=U/R;return {rl,rc,R,U,I,Uh:I*rl,Ul:I*rc,Ur:I*rl,P:I*I*rc,bpm:I*50,F:100*S4.drive};}
function stage4(t,m){

  const pr=x=>x<=g.xs?m.F:x<=g.sx1?m.F-dh*(x-g.xs)/(g.sx1-g.xs):x<=g.sx2?m.F-dh-dl*(x-g.sx1)/(g.sx2-g.sx1):x<=g.xe?m.F-dh-dl-dr*(x-g.sx2)/(g.xe-g.sx2):0;
  const ht=clamp(m.P/16,0,1);
  let s=`<defs><pattern id="hatch4" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#8d6e63"/><line x1="0" y1="0" x2="0" y2="8" stroke="#5d4037" stroke-width="3"/></pattern><clipPath id="cl4"><rect x="140" y="0" width="${g.xe-140}" height="400"/></clipPath><linearGradient id="gs4" gradientUnits="userSpaceOnUse" x1="${g.sx1}" y1="0" x2="${g.sx2}" y2="0"><stop offset="0" stop-color="${pcol(pr(g.sx1)/100)}"/><stop offset="1" stop-color="${pcol(pr(g.sx2)/100)}"/></linearGradient></defs>`;
  s+=legend([[C_A,`A drückt: ${fmt(m.F)} N`],[C_F,`Durchfluss: ${fmt(m.bpm)} Bücher pro Minute`]],30)+plegend(752,30);

  s+=`<path d="M 958 302 L 74 302" stroke="#7b8794" stroke-width="3" stroke-dasharray="10 7" fill="none"/><polygon points="60,302 76,294 76,310" fill="#7b8794"/>`;
  s+=`<text x="520" y="294" text-anchor="middle" class="sm" fill="#56606e">Rückweg: Die Bücher laufen im Kreis zurück zu A – es geht keins verloren.</text>`;
  s+=table(140,925,g.TT,g.FL);
  s+=`<polygon points="918,240 928,240 974,288 962,290" fill="#a1887f"/><rect x="930" y="284" width="66" height="34" rx="3" fill="#d7ccc8" stroke="#6d4c41" stroke-width="2"/>`;
  s+=`<rect x="${g.sx1+2}" y="62" width="6" height="${g.BY+28-62}" fill="#90a4ae"/><rect x="${g.sx2-8}" y="62" width="6" height="${g.BY+28-62}" fill="#90a4ae"/><rect x="${g.sx1+2}" y="58" width="${g.sx2-g.sx1-4}" height="7" rx="2" fill="#90a4ae"/><text x="${(g.sx1+g.sx2)/2}" y="52" text-anchor="middle" class="sm" fill="#56606e">Rahmen hält den Stapel fest</text>`;
  const CX=[392,652,900];
  for(const cx of CX)s+=`<rect x="${cx-3}" y="150" width="6" height="${g.BY+28-150}" fill="#b0bec5"/>`;
  const rcol=S4.bad?'#a1887f':'#cfd8dc';
  for(let x=g.xs+14;x<g.sx1;x+=28)s+=wheel(x,g.RY,8,S4.rot,rcol);
  for(let x=g.sx2+14;x<g.xe;x+=28)s+=wheel(x,g.RY,8,S4.rot,rcol);
  s+=`<rect x="${g.sx1}" y="${g.BY+28}" width="${g.sx2-g.sx1}" height="${g.TT-g.BY-28}" fill="url(#hatch4)"/>`;
  s+='<g clip-path="url(#cl4)">';
  for(let k=0;;k++){const x=g.xs+S4.o+k*g.P;if(x>=g.xe)break;const yo=k===0?-20*(1-ease(S4.o/(.35*g.P))):0;s+=book(x,g.BY+yo,g.BW,g.BH,pcol(pr(x+g.BW/2)/100));}

  for(let i=0;i<S4.h;i++)s+=book(g.sx1+10+(i%2?3:-2),g.BY-24*(i+1),g.sx2-g.sx1-20,24,'url(#gs4)');
  s+=heat(g.sx1+10,g.sx2-10,g.BY,ht*(.6+.4*Math.sin(t*9)))+heat(g.sx1+10,g.sx2-10,g.BY+28,ht*(.6+.4*Math.sin(t*9+1)));
  for(const t0 of S4.fall){const u=clamp((t-t0)/.9,0,1);s+=`<g transform="translate(${q(922+42*u)} ${q(214+64*u)}) rotate(${q(25+35*u)})"><rect x="-20" y="-9" width="40" height="18" rx="3" fill="${pcol(0)}" stroke="rgba(0,0,0,.5)"/></g>`;}

  s+=person(92,g.FL,1,'A',[g.xs+S4.o-1,212]);

/* =====================================================================
   SCHRITT 5 – Heizkreis
   ===================================================================== */
const S5={pump:1,valve:3,bad:false,run:true,ph:0,rot:0};
const RV=[Infinity,60,30,15,7,3],VN=['zu','fast zu','wenig offen','halb offen','weit offen','ganz offen'];
function m5(){const rp=S5.bad?6:1,rh=1,rv=RV[S5.valve],dp=200*S5.pump;
  if(S5.valve===0)return {dp,V:0,dP:0,dV:dp,dH:0,closed:true};
  const Ss=2*rp+rv+rh,V=dp>0?Math.sqrt(dp/(0.000772*Ss)):0;
  return {dp,V,dP:dp*rp/Ss,dV:dp*rv/Ss,dH:dp*rh/Ss,closed:false};}
function heizSVG(m){
  const x1=150,x2=530,y1=84,y2=300,py=192,pr=28,vt=116,vb=144,ht=176,hb=252;
  const P=[[x1,py-pr],[x1,y1],[x2,y1],[x2,vt],[x2,vb],[x2,ht],[x2,hb],[x2,y2],[x1,y2],[x1,py+pr]],S=cum(P);
  const sV=S[3],sVe=S[4],sH=S[6],sE=S[9];
  const p=s=>s<=sV?m.dp-m.dP*s/sV:s<=sVe?m.dp-m.dP-m.dV*(s-sV)/(sVe-sV):s<=sH?m.dp-m.dP-m.dV-m.dH*(s-sVe)/(sH-sVe):m.dP*(1-(s-sH)/(sE-sH));
  const ow=S5.bad?11:19,iw=S5.bad?6:13;
  let defs='',w='',o='';
  for(let i=1;i<P.length;i++){const [ax,ay]=P[i-1],[bx,by]=P[i],id='hz'+i;
    defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}"><stop offset="0" stop-color="${pcol(p(S[i-1])/200)}"/><stop offset="1" stop-color="${pcol(p(S[i])/200)}"/></linearGradient>`;
    o+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#455a64" stroke-width="${ow}" stroke-linecap="round"/>`;
    w+=`<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="url(#${id})" stroke-width="${iw}" stroke-linecap="round"/>`;}
  let dots='';
  if(m.V>0){const sp=28;for(let s=((S5.ph%sp)+sp)%sp;s<sE;s+=sp){const pt=pathAt(P,S,s);dots+=`<circle cx="${q(pt[0])}" cy="${q(pt[1])}" r="${S5.bad?2.2:3.3}" fill="#fff"/>`;}}
  let s=`<defs>${defs}</defs>`+o+w+dots;
  s+=`<polygon points="${x2-14},${vt} ${x2+14},${vt} ${x2},${(vt+vb)/2} ${x2-14},${vb} ${x2+14},${vb} ${x2},${(vt+vb)/2}" fill="#cfd8dc" stroke="#263238" stroke-width="2.5" stroke-linejoin="round"/>`;
  s+=`<line x1="${x2}" y1="${(vt+vb)/2}" x2="${x2+30}" y2="${(vt+vb)/2}" stroke="#263238" stroke-width="3"/><rect x="${x2+30}" y="${(vt+vb)/2-13}" width="30" height="26" rx="7" fill="#eceff1" stroke="#263238" stroke-width="2"/>`;
  s+=`<text x="${x2+68}" y="${(vt+vb)/2-2}" class="lbl">Thermostatventil</text><text x="${x2+68}" y="${(vt+vb)/2+20}" class="lbl" fill="${m.closed?C_A:C_L}">${VN[S5.valve]}</text>`;
  const wf=clamp(m.V/220,0,1),rc=`rgb(${Math.round(lerp(225,255,wf))},${Math.round(lerp(232,167,wf))},${Math.round(lerp(238,64,wf))})`;
  s+=`<rect x="${x2-58}" y="${ht}" width="116" height="${hb-ht}" rx="5" fill="${rc}" stroke="#607d8b" stroke-width="2.5"/>`;
  for(let x=x2-46;x<=x2+46;x+=12)s+=`<line x1="${x}" y1="${ht+6}" x2="${x}" y2="${hb-6}" stroke="#90a4ae" stroke-width="2"/>`;
  s+=`<text x="${x2+68}" y="${(ht+hb)/2+6}" class="lbl">Heizkörper</text>`;
  s+=`<circle cx="${x1}" cy="${py}" r="${pr}" fill="#eceff1" stroke="#263238" stroke-width="3"/><polygon points="${x1},${py-pr} ${x1-20},${py+17} ${x1+20},${py+17}" fill="#90a4ae" stroke="#263238" stroke-width="2"/>`;
  s+=`<text x="${x1-38}" y="${py-4}" text-anchor="end" class="lbl">Pumpe</text><text x="${x1-38}" y="${py+18}" text-anchor="end" class="lbl" fill="${C_A}">${fmt(m.dp)} mbar</text>`;
  const mano=(x,y,sAt,yP)=>{const v=p(sAt),f=clamp(v/200,0,1),a=(-135+270*f)*Math.PI/180;let t='';
    for(let i=0;i<=4;i++){const b=(-135+67.5*i)*Math.PI/180;t+=`<line x1="${q(x+Math.sin(b)*14)}" y1="${q(y-Math.cos(b)*14)}" x2="${q(x+Math.sin(b)*19)}" y2="${q(y-Math.cos(b)*19)}" stroke="#263238" stroke-width="1.8"/>`;}
    return `<line x1="${x}" y1="${y}" x2="${x}" y2="${yP}" stroke="#607d8b" stroke-width="4"/><circle cx="${x}" cy="${y}" r="21" fill="#fff" stroke="#263238" stroke-width="2.5"/>${t}<line x1="${x}" y1="${y}" x2="${q(x+Math.sin(a)*14)}" y2="${q(y-Math.cos(a)*14)}" stroke="${C_A}" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3" fill="#263238"/><text x="${x+28}" y="${y+7}" class="lbl" fill="${pcol(f)}">${fmt(v)} mbar</text>`;};
  s+=mano(x1+70,y1-44,(py-pr-y1)+70,y1)+mano(x2-110,y1-44,(py-pr-y1)+(x2-110-x1),y1);
  s+=mano(x2-110,y2+44,S[7]+110,y2)+mano(x1+70,y2+44,S[7]+(x2-x1-70),y2);
  s+=`<text x="${(x1+x2)/2}" y="${y1-14}" text-anchor="middle" class="sm" font-weight="700" fill="#56606e">Vorlauf →</text><text x="${(x1+x2)/2}" y="${y2+30}" text-anchor="middle" class="sm" font-weight="700" fill="#56606e">← Rücklauf</text>`;
  s+=`<text x="${(x1+x2)/2-30}" y="${py}" text-anchor="middle" class="big" fill="${C_F}">V̇ = ${fmt(m.V)} l/h</text><text x="${(x1+x2)/2-30}" y="${py+26}" text-anchor="middle" class="sm" fill="#333">Volumenstrom – überall im Kreis gleich</text>`;
  return svg(770,370,s);
}
function chart5(m){
  return chart({x:[0,1],y:[0,200],yt:[0,50,100,150,200],xt:[[.16,'Vorlauf',false],[.41,'Ventil',false],[.59,'Heizkörper',false],[.84,'Rücklauf',false]],xlab:'Weg durch den Heizkreis: Pumpe → … → Pumpe',ylab:'Druck in mbar',content:(sx,sy)=>{
    let s=`<rect x="${q(sx(.32))}" y="${q(sy(200))}" width="${q(sx(.5)-sx(.32))}" height="${q(sy(0)-sy(200))}" fill="#fff0e0"/>`;
    const a=m.dp,P=[[0,a],[.32,a-m.dP],[.5,a-m.dP-m.dV],[.68,m.dP],[1,0]].map(v=>[sx(v[0]),sy(v[1])]);
    s+=poly([P[0],P[1]],C_G,5)+poly([P[1],P[2]],C_L,6)+poly([P[2],P[3]],'#f9a825',5)+poly([P[3],P[4]],C_G,5);
    for(const v of P)s+=`<circle cx="${q(v[0])}" cy="${q(v[1])}" r="6" fill="#263238" stroke="#fff" stroke-width="2"/>`;
    s+=`<text x="${q(sx(.16))}" y="${q(sy(a-m.dP/2)+26)}" text-anchor="middle" class="clab" fill="${C_G}">−${fmt(m.dP)} mbar</text>`;
    s+=`<text x="${q(sx(.5)+8)}" y="${q(sy(a*.5)+4)}" class="clab" fill="${C_L}">Ventil −${fmt(m.dV)} mbar</text>`;
    s+=`<text x="${q(sx(.84))}" y="${q(sy(m.dP/2)-14)}" text-anchor="middle" class="clab" fill="${C_G}">−${fmt(m.dP)} mbar</text>`;
    return s;}});
}
function vals5(m){
  let s=`<div class="row"><span><i class="dot" style="background:${C_A}"></i>Pumpe (Antrieb)</span><b>${fmt(m.dp)} mbar</b></div>
<div class="row"><span><i class="dot" style="background:${C_F}"></i>Volumenstrom V̇ (überall gleich)</span><b>${fmt(m.V)} l/h</b></div>
<div class="row"><span>Druckabfall Vorlauf (Rohrreibung)</span><b>${fmt(m.dP)} mbar</b></div>
<div class="row"><span>Druckabfall Thermostatventil</span><b>${fmt(m.dV)} mbar</b></div>
<div class="row"><span>Druckabfall Heizkörper</span><b>${fmt(m.dH)} mbar</b></div>
<div class="row"><span>Druckabfall Rücklauf (Rohrreibung)</span><b>${fmt(m.dP)} mbar</b></div>
<div class="row"><span>Alle Druckabfälle zusammen</span><b>= Pumpendruck ${fmt(m.dp)} mbar</b></div>`;
  if(m.closed)s+=`<div class="warnbox">Ventil zu: Es fließt nichts. Ohne Durchfluss gibt es keine Rohrreibung – der ganze Pumpendruck (${fmt(m.dp)} mbar) liegt am Ventil an. Beim Strom ist es genauso: Am offenen Schalter liegt die ganze Spannung.</div>`;
  return s;}

const TR=(rows,h)=>`<table class="tr"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const STEPS=[
{tab:'1 Kurze & lange Reihe',title:'1 · Spannung ist Antrieb – Spannungsabfall ist Verlust',
 lead:'A schiebt eine Reihe Bücher immer gleich fest an: 100 N. B hält am anderen Ende dagegen. Unterwegs bremst die Reibung jedes Buch. Wie fest muss B noch dagegenhalten, wenn die Reihe länger wird?',
 html:`<div class="card stage" id="stage"></div>
<div class="controls"><button class="btn" id="b1m">− Buch</button><button class="btn" id="b1p">+ Buch</button><button class="btn primary" id="b1a">▶ Ablauf: 1 bis 6 Bücher</button><button class="btn" id="b1r">↺ Zurücksetzen</button></div>
<div class="grid3"><div class="card chart" id="chart"></div><div class="card vals" id="vals"></div>
<div class="card"><div class="merk"><b>Merksatz</b>Die Spannung ist der Antrieb im Stromkreis – wie der Druck von A. Ein Widerstand bremst – wie die Reibung der Bücher. Je länger die Leitung, desto größer ihr Widerstand und desto mehr Spannung fällt auf ihr ab. Beim Verbraucher kommt dann weniger an.</div>
${TR([['A drückt','Spannungsquelle: Quellenspannung U₁ in Volt (V)'],['Reibung der Bücher','Widerstand der Leitung'],['Reibungsverlust','Spannungsabfall auf der Leitung'],['was B noch spürt','Spannung am Verbraucher U₂']],['Bücher','Stromkreis'])}</div></div>`,
 init(){on('b1m',()=>{S1.auto=false;if(!S1.anim&&S1.n>1)S1.n--;});on('b1p',()=>{S1.auto=false;s1add();});
   on('b1a',()=>{S1.anim=null;S1.n=1;S1.auto=true;S1.next=now()+1;});on('b1r',()=>{S1.anim=null;S1.n=1;S1.auto=false;});},
 frame(t){if(S1.auto&&!S1.anim&&t>=S1.next){if(S1.n<6){s1add();S1.next=t+2.6;}else S1.auto=false;}
   put('stage',stage1(t));put('chart',chart1(S1.n));put('vals',vals1(S1.n));}},

${TR([['Unterschied zwischen zwei Messstellen','Spannung (Spannungsabfall) in V','Druckdifferenz (Druckverlust) in mbar'],['gleichmäßig über die Strecke','lange Leitung','langes Rohr: Rohrreibung, auf jedem Meter etwas']],['Bücher','Strom','Wasser'])}</div></div>`,

{tab:'3 Rollen – Stapel – Rollen',title:'3 · Rollen – Stapel – Rollen: so ist es im Stromkreis',

{tab:'4 Durchfluss = Strom',title:'4 · Jetzt fließt etwas: Durchfluss = Strom',
 lead:'A schiebt dauernd nach. Die Bücher rollen zum festen Stapel (der Lampe), werden darunter durchgeschoben, rollen weiter und laufen im Kreis zurück. Wie viele Bücher pro Minute an einer Stelle vorbeikommen, ist der Durchfluss – im Stromkreis die Stromstärke I in Ampere (A).',
 html:`<div class="card stage" id="stage"></div>
<div class="controls"><label class="ctl">Antrieb <input type="range" id="r4d" min="0" max="100" step="5" value="100"><b id="o4d"></b></label>
<label class="ctl">Stapel = Lampe <input type="range" id="r4h" min="1" max="5" step="1" value="3"><b id="o4h"></b></label>
<span class="ctl">Leitung: <button class="btn on" id="b4g">gute Rollen</button><button class="btn" id="b4b">schwergängige Rollen</button></span>

<div class="grid3"><div class="card"><div class="circ" id="circ"></div><ul class="probe hint"><li>Stapel höher: Was passiert mit dem Durchfluss und der Lampe?</li><li>Schwergängige Rollen (= lange, dünne Leitung): Wie viel Spannung bleibt für die Lampe?</li><li>Fachbuch: Bohrhammer an langer Leitung – 6,98 V Spannungsabfall, am Gerät nur noch 223 V (Grundkenntnisse SHK, 6. Aufl., S. 249).</li></ul></div>
<div class="card"><div class="chart" id="chart"></div></div>
<div class="card"><div class="vals" id="vals"></div><div class="merk" style="margin-top:8px"><b>Merksatz</b>Die Spannung (der Druck) wird unterwegs abgebaut – der Strom (der Durchfluss) nicht. Er ist überall im Kreis gleich groß, vor der Lampe genauso wie dahinter. Mehr Spannung → mehr Strom. Mehr Widerstand → weniger Strom: I = U ÷ R.</div></div></div>`,
 init(){const upd=()=>{const m=m4();document.getElementById('o4d').textContent=`${fmt(m.F)} N ≙ ${fmt(m.U,1)} V`;document.getElementById('o4h').textContent=`${S4.h} ${S4.h===1?'Buch':'Bücher'} ≙ ${8*S4.h} Ω`;
     document.getElementById('b4g').classList.toggle('on',!S4.bad);document.getElementById('b4b').classList.toggle('on',S4.bad);document.getElementById('b4run').textContent=S4.run?'⏸ Pause':'▶ Start';
     document.getElementById('r4d').value=S4.drive*100;document.getElementById('r4h').value=S4.h;};
   on('r4d',e=>{S4.drive=e.target.value/100;upd();},'input');on('r4h',e=>{S4.h=+e.target.value;upd();},'input');
   on('b4g',()=>{S4.bad=false;upd();});on('b4b',()=>{S4.bad=true;upd();});on('b4run',()=>{S4.run=!S4.run;upd();});
   on('b4r',()=>{Object.assign(S4,{drive:1,h:3,bad:false,run:true,o:30});upd();});upd();},
 frame(t,dt){const m=m4(),v=m.bpm/60*G4.P;if(S4.run){S4.o+=v*dt;S4.rot+=v*dt/8;S4.ph+=v*dt;while(S4.o>=G4.P){S4.o-=G4.P;S4.fall.push(t);}}
   S4.fall=S4.fall.filter(t0=>t-t0<.9);
   put('stage',stage4(t,m));put('circ',circuitSVG({id:'c4',U:m.U,Uh:m.Uh,Ul:m.Ul,Ur:m.Ur,I:m.I,ph:S4.ph,glow:m.P/16,amps:true}));put('chart',chart4(m));put('vals',vals4(m));}},

<tr><th>Zusammenhang</th><td>mehr Druck → schneller, mehr Reibung → langsamer</td><td>I = U ÷ R: doppelter Strom → doppelter Spannungsabfall</td><td>doppelter Volumenstrom → vierfacher Druckverlust</td></tr>

<div class="merk"><b>1. Antrieb</b>Spannung (Strom) und Pumpendruck (Wasser) sind der Antrieb – wie A, der die Bücher schiebt.</div>
<div class="merk"><b>2. Abfall</b>Jeder Widerstand „verbraucht“ ein Stück vom Antrieb. Wo der Widerstand groß ist, fällt viel ab: in der Lampe, am Ventil. In guten Leitungen und Rohren fällt wenig ab.</div>

/* ---------- Navigation ---------- */
let cur=0;
function show(i){cur=clamp(i,0,STEPS.length-1);const st=STEPS[cur];
  document.getElementById('ttl').textContent=st.title;document.getElementById('lead').textContent=st.lead;
  document.getElementById('content').innerHTML=st.html;st.init();
  document.querySelectorAll('#tabs button').forEach((b,k)=>b.classList.toggle('on',k===cur));
  document.getElementById('pos').textContent=`Schritt ${cur+1} von ${STEPS.length} · Tasten ← → blättern · F = Vollbild`;
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===STEPS.length-1;
  try{history.replaceState(null,'','#'+(cur+1));}catch(e){}}
document.getElementById('tabs').innerHTML=STEPS.map((s,k)=>`<button data-k="${k}">${s.tab}</button>`).join('');
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(+b.dataset.k);});
on('prev',()=>show(cur-1));on('next',()=>show(cur+1));
const fs=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}catch(e){}};
on('fs',fs);
document.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){show(cur+1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);e.preventDefault();}
  else if(e.key==='f'||e.key==='F'){fs();}});
let last=performance.now();
function loop(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;try{STEPS[cur].frame(ts/1000,dt);}catch(err){console.error(err);}requestAnimationFrame(loop);}
const h=parseInt((location.hash||'').slice(1),10);show(h>=1&&h<=STEPS.length?h-1:0);
requestAnimationFrame(loop);
})();
</script>
